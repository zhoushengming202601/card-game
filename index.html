<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白日梦想家 · 九卡博弈</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0a0f1e">
    <meta name="description" content="九张未知卡牌，一张底牌；在翻牌与出价之间，赌一次自己的判断。">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="九卡博弈">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #1a1f2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 25, 40, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 2.2rem;
            padding: 1.6rem 1.2rem 1.6rem 1.2rem;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 220, 100, 0.3);
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #f5e6b0;
            text-shadow: 0 0 15px #ffd966, 0 0 30px #b8860b;
            margin-bottom: 0.4rem;
            font-family: 'Times New Roman', serif;
            word-break: break-word;
        }

        .subtitle {
            text-align: center;
            color: #bfb37b;
            font-size: 0.8rem;
            margin-bottom: 1.4rem;
            letter-spacing: 2px;
            font-style: italic;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.9rem;
            margin: 1rem 0 1.4rem;
        }

        .card {
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, #2a2f42, #1b1f2b);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 215, 0, 0.3);
            border: 1px solid rgba(200, 170, 70, 0.4);
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        @media (hover: hover) {
            .card:hover::before { opacity: 1; }
            .card:hover {
                transform: translateY(-6px) scale(1.02);
                box-shadow: 0 20px 30px -8px #000, 0 0 20px rgba(255, 215, 0, 0.3);
            }
        }

        .card:active:not(.selected):not(.revealed) {
            transform: scale(0.97);
        }

        .card.selected {
            box-shadow: 0 0 0 3px #f5d742, 0 0 30px #ffb347;
            transform: scale(1.02);
            cursor: default;
            background: linear-gradient(135deg, #3a3f5a, #252a3a);
        }

        .card.revealed {
            background: linear-gradient(135deg, #2d3142, #1f2332);
            cursor: pointer;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 0 1px #d4af37;
        }

        .card.revealed .card-number {
            opacity: 0.4;
        }

        .card-number {
            font-size: 2.6rem;
            font-weight: 800;
            color: #e6d9a8;
            text-shadow: 0 0 20px #ffd966, 0 0 5px #000;
            line-height: 1;
            transition: opacity 0.3s;
            z-index: 2;
        }

        .card-amount {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffecb3;
            text-shadow: 0 0 20px #f0b300, 0 0 5px #000;
            margin-top: 0.3rem;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .card-amount small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #b8a664;
            margin-left: 1px;
        }

        .card-status {
            font-size: 0.7rem;
            color: #b9a86b;
            margin-top: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .info-panel {
            background: #0e121c;
            border-radius: 1.5rem;
            padding: 1.1rem 1rem;
            margin: 0.8rem 0 0.8rem;
            border: 1px solid #3b3f2c;
            box-shadow: inset 0 0 30px #00000055, 0 5px 10px #00000033;
        }

        .message-area {
            font-size: 1rem;
            min-height: 3rem;
            text-align: center;
            color: #ffefc0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            background: #121724;
            border-radius: 1.2rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.9rem;
            border-left: 3px solid #ffd966;
            border-right: 3px solid #ffd966;
            letter-spacing: 0.3px;
            box-shadow: 0 0 15px #00000055;
            word-break: break-word;
            line-height: 1.4;
        }

        .bid-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .bid-box {
            background: #1b1f2b;
            border-radius: 1.5rem;
            padding: 0.5rem 1.2rem;
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffd966;
            border: 1px solid #b8860b;
            box-shadow: inset 0 0 15px #00000088, 0 0 15px #ffd96633;
            min-width: 120px;
            text-align: center;
        }

        .bid-label {
            font-size: 0.8rem;
            color: #bdae76;
            letter-spacing: 1px;
        }

        .btn {
            background: linear-gradient(145deg, #2b2f40, #1b1e2a);
            border: 1px solid #bfa75c;
            color: #f5e6b0;
            font-weight: 700;
            padding: 0.7rem 1.4rem;
            border-radius: 2.5rem;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #0a0c12, 0 8px 20px #00000080;
            text-transform: uppercase;
        }

        @media (hover: hover) {
            .btn:hover:not(:disabled) {
                background: linear-gradient(145deg, #3f445a, #262b3c);
                box-shadow: 0 4px 0 #0a0c12, 0 10px 20px #00000080;
                transform: translateY(2px);
                border-color: #ffd966;
                color: #fff3cf;
            }
        }

        .btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0a0c12, 0 5px 15px #000000;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #0a0c12;
            transform: translateY(2px);
            border-color: #5a5540;
        }

        .btn-primary {
            background: linear-gradient(145deg, #5d4e1a, #3d3310);
            border-color: #f5d742;
            color: #ffefc0;
            box-shadow: 0 5px 0 #1e1a09, 0 8px 20px #000000;
        }

        .action-buttons {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .reset-btn {
            background: #1e212b;
            border-color: #666;
            color: #aaa;
            box-shadow: 0 3px 0 #0a0c12;
            padding: 0.5rem 1.2rem;
            font-size: 0.75rem;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #5a5e6b;
            margin-top: 0.6rem;
            letter-spacing: 0.5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            align-items: center;
        }

        .amount-pool {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .pool-item {
            color: #d4af37;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s;
            padding: 0 0.15rem;
        }

        .pool-item.crossed {
            text-decoration: line-through;
            color: #555;
            opacity: 0.6;
        }

        .amount-tier-1 { color: #aab8c5; }
        .amount-tier-2 { color: #8fc7e8; }
        .amount-tier-3 { color: #f5d742; }
        .amount-tier-4 { color: #ff9f4b; }
        .amount-tier-5 { color: #ff5e5e; text-shadow: 0 0 25px #ff0000; }

        /* ====== 弹窗对话框样式 ====== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: linear-gradient(150deg, #1e2433, #12161f);
            border-radius: 1.8rem;
            padding: 1.8rem 1.5rem 1.5rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.45);
            box-shadow: 0 30px 60px -15px #000, 0 0 40px rgba(255, 215, 0, 0.15);
            text-align: center;
            transform: translateY(20px) scale(0.96);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }
        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f5e6b0;
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        /* 新增：卡片金额展示区 */
        .modal-card-info {
            background: rgba(255, 215, 0, 0.06);
            border: 1px dashed rgba(255, 215, 0, 0.35);
            border-radius: 1rem;
            padding: 0.7rem 0.8rem;
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .modal-card-info-label {
            font-size: 0.85rem;
            color: #bdae76;
            letter-spacing: 1px;
        }
        .modal-card-info-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffecb3;
            text-shadow: 0 0 20px #f0b300, 0 0 5px #000;
        }
        .modal-card-info-value small {
            font-size: 0.9rem;
            font-weight: 600;
            color: #b8a664;
        }
        /* 报价展示区 */
        .modal-bid-label {
            font-size: 0.8rem;
            color: #8fc7e8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }
        .modal-bid {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffd966;
            text-shadow: 0 0 25px #f0b300, 0 0 6px #000;
            margin: 0.2rem 0 1rem;
            letter-spacing: 1px;
        }
        .modal-desc {
            font-size: 0.95rem;
            color: #bfb37b;
            margin-bottom: 1.4rem;
            line-height: 1.5;
        }
        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .modal-buttons .btn {
            flex: 1;
            padding: 0.8rem 0.6rem;
            font-size: 0.95rem;
        }

        /* ====== 自定义金额池面板 ====== */
        .custom-panel {
            background: #0e121c;
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #3b3f2c;
            box-shadow: inset 0 0 20px #00000055;
        }
        .custom-label {
            font-size: 0.8rem;
            color: #bdae76;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }
        .custom-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .custom-input {
            flex: 1;
            min-width: 120px;
            background: #1b1f2b;
            border: 1px solid #5a5540;
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            color: #ffefc0;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }
        .custom-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }
        .custom-input::placeholder {
            color: #6b6550;
            font-weight: 400;
        }
        .btn-small {
            padding: 0.55rem 1rem;
            font-size: 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 3px 0 #0a0c12, 0 5px 12px #00000080;
        }
        .custom-hint {
            font-size: 0.7rem;
            color: #6b6550;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
        }
        .custom-active-badge {
            display: inline-block;
            margin-left: 0.5rem;
            background: #3d3310;
            color: #ffd966;
            font-size: 0.65rem;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            border: 1px solid #b8860b;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }

        @media (max-width: 480px) {
            .game-container { padding: 1.2rem 0.8rem; border-radius: 1.8rem; }
            .title { font-size: 1.6rem; letter-spacing: 2px; }
            .grid { gap: 0.6rem; }
            .card-number { font-size: 2rem; }
            .card-amount { font-size: 1rem; }
            .card-amount small { font-size: 0.6rem; }
            .card-status { font-size: 0.6rem; }
            .message-area { font-size: 0.85rem; min-height: 2.5rem; }
            .bid-box { font-size: 1.1rem; min-width: 100px; padding: 0.4rem 1rem; }
            .bid-label { font-size: 0.7rem; }
            .btn { padding: 0.6rem 1rem; font-size: 0.8rem; }
            .footer-note { font-size: 0.65rem; }
            .amount-pool { font-size: 1.05rem; gap: 0.4rem; }
            .pool-item { font-size: 1.05rem; }
            .modal-box { padding: 1.4rem 1rem 1.2rem; border-radius: 1.4rem; }
            .modal-title { font-size: 1.1rem; }
            .modal-card-info-value { font-size: 1.3rem; }
            .modal-bid { font-size: 1.8rem; }
            .modal-desc { font-size: 0.85rem; }
            .modal-buttons .btn { font-size: 0.85rem; padding: 0.7rem 0.4rem; }
            .custom-input { font-size: 0.85rem; padding: 0.5rem 0.8rem; }
        }

        @media (max-width: 360px) {
            .card-number { font-size: 1.7rem; }
            .card-amount { font-size: 0.85rem; }
            .title { font-size: 1.4rem; }
            .amount-pool { font-size: 0.95rem; }
            .pool-item { font-size: 0.95rem; }
            .modal-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="title">白日梦想家</div>
    <div class="subtitle">✦ 九卡 · 抉择时刻 ✦</div>

    <!-- 自定义金额池面板 -->
    <div class="custom-panel" id="customPanel">
        <label class="custom-label">
            自定义金额池（9个数字，逗号分隔）
            <span class="custom-active-badge" id="customBadge" style="display:none;">已启用</span>
        </label>
        <div class="custom-row">
            <input type="text" class="custom-input" id="customInput" placeholder="例如：1,5,20,80,150,250,350,600,1200">
            <button class="btn btn-small btn-primary" id="applyCustomBtn">应用</button>
            <button class="btn btn-small reset-btn" id="resetCustomBtn">默认</button>
        </div>
        <div class="custom-hint">输入9个正整数，用逗号或空格分隔。应用后立即生效（将重置游戏）。</div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div class="info-panel">
        <div class="message-area" id="message">选择一张卡片作为你的底牌</div>
        <div class="bid-area">
            <span class="bid-label">游戏方出价</span>
            <div class="bid-box" id="bidDisplay">—</div>
        </div>
        <div class="action-buttons" id="actionPanel"></div>
    </div>
    <div class="footer-note">
        <span>金额池：</span>
        <span class="amount-pool" id="amountPool"></span>
    </div>
</div>

<!-- 报价弹窗（增加翻出卡片金额展示） -->
<div class="modal-overlay" id="offerModal">
    <div class="modal-box">
        <div class="modal-title">📢 游戏方报价</div>

        <!-- 新增：翻出卡片金额 -->
        <div class="modal-card-info">
            <span class="modal-card-info-label">你翻出的卡片金额</span>
            <span class="modal-card-info-value" id="modalCardAmount">— <small>金币</small></span>
        </div>

        <!-- 回收报价 -->
        <div class="modal-bid-label">回收报价</div>
        <div class="modal-bid" id="modalBidAmount">—</div>

        <div class="modal-desc" id="modalDesc">你的卡片回收报价为 <b id="modalDescAmount">—</b>，是否成交？</div>
        <div class="modal-buttons">
            <button class="btn btn-primary" id="modalAcceptBtn">✅ 成交</button>
            <button class="btn" id="modalContinueBtn">🔄 继续翻牌</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 默认金额池
        const DEFAULT_AMOUNTS = [1, 10, 50, 100, 200, 300, 400, 500, 1000];
        // 当前生效的金额池
        let FIXED_AMOUNTS = [...DEFAULT_AMOUNTS];

        const state = {
            cards: [],
            selectedCardId: null,
            gamePhase: 'selecting',
            currentBid: null,
            bidCardId: null,
            canRespond: false,
            offerResolved: false,
            crossedAmounts: [],
        };

        const gridEl = document.getElementById('cardGrid');
        const messageEl = document.getElementById('message');
        const bidDisplayEl = document.getElementById('bidDisplay');
        const actionPanelEl = document.getElementById('actionPanel');
        const amountPoolEl = document.getElementById('amountPool');

        // 弹窗元素
        const offerModal = document.getElementById('offerModal');
        const modalCardAmount = document.getElementById('modalCardAmount');
        const modalBidAmount = document.getElementById('modalBidAmount');
        const modalDescAmount = document.getElementById('modalDescAmount');
        const modalAcceptBtn = document.getElementById('modalAcceptBtn');
        const modalContinueBtn = document.getElementById('modalContinueBtn');

        // 自定义金额池元素
        const customInput = document.getElementById('customInput');
        const applyCustomBtn = document.getElementById('applyCustomBtn');
        const resetCustomBtn = document.getElementById('resetCustomBtn');
        const customBadge = document.getElementById('customBadge');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ========== 新版出价逻辑（分两层：先硬上限，再折扣） ==========
        function generateBidAmount(revealedCardAmount, bottomCandidates) {
            const n = bottomCandidates.length;
            if (n === 0) return revealedCardAmount;
            if (n === 1) {
                return bottomCandidates[0];
            }

            const sum = bottomCandidates.reduce((a, b) => a + b, 0);
            const E = sum / n;
            const MAX = Math.max(...bottomCandidates);
            const hasGrandPrize = bottomCandidates.includes(1000);

            let discount;
            if (hasGrandPrize) {
                if (n >= 6) discount = 0.60;
                else if (n >= 3) discount = 0.70;
                else discount = 0.80;
            } else {
                if (n >= 5) discount = 0.55;
                else if (n >= 3) discount = 0.65;
                else discount = 0.72;
            }

            let rawBid = E * discount;
            rawBid = Math.min(rawBid, MAX);
            rawBid = Math.max(rawBid, revealedCardAmount);

            let rounded = roundToNice(rawBid);
            rounded = Math.max(rounded, revealedCardAmount);
            rounded = Math.min(rounded, MAX);
            rounded = Math.max(1, rounded);

            return rounded;
        }

        function roundToNice(value) {
            if (value >= 1000) return Math.round(value / 100) * 100;
            else if (value >= 200) return Math.round(value / 50) * 50;
            else if (value >= 50) return Math.round(value / 10) * 10;
            else if (value >= 10) return Math.round(value / 5) * 5;
            else return Math.round(value);
        }

        function getBottomCardCandidates() {
            const revealedAmounts = state.cards
                .filter(c => c.revealed && c.id !== state.selectedCardId)
                .map(c => c.amount);
            return FIXED_AMOUNTS.filter(a => !revealedAmounts.includes(a));
        }

        function getAmountTierClass(amount) {
            if (amount <= 10) return 'amount-tier-1';
            if (amount <= 100) return 'amount-tier-2';
            if (amount <= 300) return 'amount-tier-3';
            if (amount <= 600) return 'amount-tier-4';
            return 'amount-tier-5';
        }

        function initCards() {
            const shuffled = shuffle(FIXED_AMOUNTS);
            return shuffled.map((amount, index) => ({
                id: index + 1,
                amount: amount,
                revealed: false,
            }));
        }

        function resetGame() {
            state.cards = initCards();
            state.selectedCardId = null;
            state.gamePhase = 'selecting';
            state.currentBid = null;
            state.bidCardId = null;
            state.canRespond = false;
            state.offerResolved = false;
            state.crossedAmounts = [];

            hideModal();
            renderAll();
            setMessage('选择一张卡片作为你的底牌（金额池：' + FIXED_AMOUNTS.join(' / ') + '）');
            bidDisplayEl.textContent = '—';
        }

        function setMessage(text) {
            messageEl.textContent = text;
        }

        function findCardById(id) {
            return state.cards.find(c => c.id === id);
        }

        function renderAll() {
            renderGrid();
            renderActionPanel();
            renderBidDisplay();
            renderAmountPool();
        }

        function renderAmountPool() {
            amountPoolEl.innerHTML = '';
            FIXED_AMOUNTS.forEach(amount => {
                const span = document.createElement('span');
                span.className = 'pool-item' + (state.crossedAmounts.includes(amount) ? ' crossed' : '');
                span.textContent = amount;
                amountPoolEl.appendChild(span);
            });
        }

        function renderGrid() {
            gridEl.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const card = findCardById(i);
                if (!card) continue;

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                if (state.selectedCardId === i) cardDiv.classList.add('selected');
                if (card.revealed) cardDiv.classList.add('revealed');

                const numSpan = document.createElement('div');
                numSpan.className = 'card-number';
                numSpan.textContent = i;

                const isFinished = state.gamePhase === 'finished';
                const isBottom = state.selectedCardId === i;

                let showAmount = false;
                if (isFinished) {
                    showAmount = true;
                } else if (card.revealed && !isBottom) {
                    showAmount = true;
                }

                if (showAmount) {
                    const amountDiv = document.createElement('div');
                    amountDiv.className = `card-amount ${getAmountTierClass(card.amount)}`;
                    const fire = card.amount >= 500 ? '🔥' : (card.amount >= 200 ? '💎' : '');
                    amountDiv.innerHTML = `${card.amount}${fire ? '<small>'+fire+'</small>' : '<small>💰</small>'}`;
                    cardDiv.appendChild(amountDiv);
                } else {
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'card-status';
                    if (isBottom) {
                        statusDiv.textContent = '底牌';
                    } else {
                        statusDiv.textContent = '???';
                    }
                    cardDiv.appendChild(statusDiv);
                }

                cardDiv.prepend(numSpan);
                cardDiv.addEventListener('click', () => handleCardClick(i));
                gridEl.appendChild(cardDiv);
            }
        }

        function renderActionPanel() {
            actionPanelEl.innerHTML = '';

            if (state.gamePhase === 'selecting') {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn reset-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                actionPanelEl.appendChild(resetBtn);
            } else if (state.gamePhase === 'revealing') {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn reset-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                actionPanelEl.appendChild(resetBtn);
            } else if (state.gamePhase === 'offer' && state.canRespond) {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn reset-btn';
                resetBtn.textContent = '重开';
                resetBtn.addEventListener('click', resetGame);
                actionPanelEl.appendChild(resetBtn);
            } else if (state.gamePhase === 'finished') {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn btn-primary';
                resetBtn.textContent = '再玩一次';
                resetBtn.addEventListener('click', resetGame);
                actionPanelEl.appendChild(resetBtn);
            } else {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn reset-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                actionPanelEl.appendChild(resetBtn);
            }
        }

        function renderBidDisplay() {
            if (state.currentBid !== null) {
                bidDisplayEl.textContent = `${state.currentBid} 金币`;
                bidDisplayEl.style.color = state.currentBid > 700 ? '#ff9f4b' : (state.currentBid > 300 ? '#ffd966' : '#b8a664');
            } else {
                bidDisplayEl.textContent = '—';
                bidDisplayEl.style.color = '#ffd966';
            }
        }

        // ====== 弹窗控制 ======
        function showModal(bidAmount, cardAmount) {
            // 显示翻出的卡片金额
            modalCardAmount.innerHTML = `${cardAmount} <small>金币</small>`;
            // 显示报价
            modalBidAmount.textContent = bidAmount + ' 金币';
            modalDescAmount.textContent = bidAmount + ' 金币';
            offerModal.classList.add('active');
        }

        function hideModal() {
            offerModal.classList.remove('active');
        }

        function handleCardClick(cardId) {
            if (state.gamePhase === 'finished') return;

            const card = findCardById(cardId);
            if (!card) return;

            if (state.gamePhase === 'selecting') {
                if (card.revealed) return;
                state.selectedCardId = cardId;
                state.gamePhase = 'revealing';
                setMessage(`你选择了卡片 ${cardId} 作为底牌。现在点击其他卡片翻开，游戏方会出价回收。`);
                renderAll();
                return;
            }

            if (state.gamePhase === 'revealing') {
                if (cardId === state.selectedCardId) {
                    setMessage('这是你的底牌，不能翻开。请选择其他卡片。');
                    return;
                }
                if (card.revealed) {
                    setMessage('这张卡片已经翻开了，请选择其他卡片。');
                    return;
                }

                card.revealed = true;
                if (!state.crossedAmounts.includes(card.amount)) {
                    state.crossedAmounts.push(card.amount);
                }
                triggerOffer(cardId);
                renderAll();
                return;
            }

            if (state.gamePhase === 'offer') {
                setMessage('请在弹出的对话框中做出选择');
                return;
            }
        }

        function triggerOffer(cardId) {
            const card = findCardById(cardId);
            if (!card) return;

            const bottomCandidates = getBottomCardCandidates();
            const bidAmount = generateBidAmount(card.amount, bottomCandidates);

            state.currentBid = bidAmount;
            state.bidCardId = cardId;
            state.gamePhase = 'offer';
            state.canRespond = true;
            state.offerResolved = false;

            setMessage(`游戏方对卡片 ${cardId} 出价 ${bidAmount} 金币，请在弹窗中做出选择。`);
            renderAll();
            // 显示弹窗，同时传入卡片金额和报价
            showModal(bidAmount, card.amount);
        }

        function handleAcceptOffer() {
            if (state.gamePhase !== 'offer' || !state.canRespond) return;
            if (state.offerResolved) return;

            const bidAmount = state.currentBid;
            const cardId = state.bidCardId;
            const card = findCardById(cardId);
            const actualAmount = card ? card.amount : 0;

            state.gamePhase = 'finished';
            state.canRespond = false;
            state.offerResolved = true;

            hideModal();
            renderAll();

            let evaluation = '';
            if (bidAmount > actualAmount * 1.3) evaluation = '🎉 不错！赚了一笔！';
            else if (bidAmount > actualAmount) evaluation = '👍 小赚一点，稳妥！';
            else evaluation = '😐 刚好保本，不亏不赚。';

            setMessage(`✅ 成交！你以 ${bidAmount} 金币卖出了卡片 ${cardId}（实际金额 ${actualAmount} 金币）。${evaluation} 游戏结束。`);
            bidDisplayEl.textContent = `${bidAmount} 金币`;
        }

        function handleContinueReveal() {
            if (state.gamePhase !== 'offer' || !state.canRespond) return;
            if (state.offerResolved) return;

            const rejectedBid = state.currentBid;

            state.offerResolved = true;
            state.canRespond = false;
            state.currentBid = null;
            state.bidCardId = null;
            state.gamePhase = 'revealing';

            hideModal();

            const availableCards = state.cards.filter(c => c.id !== state.selectedCardId && !c.revealed);
            if (availableCards.length === 0) {
                endGameNoMoreCards();
                return;
            }

            setMessage(`你拒绝了 ${rejectedBid} 金币的出价。请继续点击其他卡片翻开。`);
            renderAll();
        }

        function endGameNoMoreCards() {
            state.gamePhase = 'finished';
            state.canRespond = false;

            const bottomCard = findCardById(state.selectedCardId);
            const bottomAmount = bottomCard ? bottomCard.amount : 0;
            setMessage(`所有卡片已翻开，没有更多机会。你保留了底牌卡片 ${state.selectedCardId}，获得 ${bottomAmount} 金币。游戏结束。`);

            renderAll();
        }

        // ====== 弹窗按钮事件 ======
        modalAcceptBtn.addEventListener('click', handleAcceptOffer);
        modalContinueBtn.addEventListener('click', handleContinueReveal);

        // ====== 自定义金额池 ======
        function applyCustomAmounts() {
            const raw = customInput.value.trim();
            if (!raw) {
                alert('请输入9个数字，用逗号或空格分隔');
                return;
            }
            const parts = raw.split(/[,，\s]+/).filter(s => s.length > 0);
            const nums = parts.map(s => Number(s));

            if (nums.length !== 9) {
                alert('请输入恰好9个数字，当前输入了 ' + nums.length + ' 个');
                return;
            }
            if (nums.some(n => !Number.isFinite(n) || n <= 0 || !Number.isInteger(n))) {
                alert('所有金额必须是正整数');
                return;
            }
            if (new Set(nums).size !== 9) {
                alert('9个金额不能重复');
                return;
            }

            FIXED_AMOUNTS = [...nums];
            customBadge.style.display = 'inline-block';
            resetGame();
        }

        function resetToDefault() {
            FIXED_AMOUNTS = [...DEFAULT_AMOUNTS];
            customInput.value = '';
            customBadge.style.display = 'none';
            resetGame();
        }

        applyCustomBtn.addEventListener('click', applyCustomAmounts);
        resetCustomBtn.addEventListener('click', resetToDefault);
        customInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') applyCustomAmounts();
        });

        // 初始化
        resetGame();
    })();
</script>
